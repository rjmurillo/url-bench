name: Dependency auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Approve PR
        run: gh pr review --approve "$PR_URL"

      # Enabling auto-merge fails when the PR is already mergeable (e.g. checks
      # finished first), so fall back to merging directly. Rulesets still apply.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL" || gh pr merge --squash "$PR_URL"
