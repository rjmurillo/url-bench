name: Main build

on:
  workflow_dispatch:
    inputs:
      run_performance:
        description: 'Run performance job? (true/false)'
        required: false
        default: false
        type: boolean
  # No paths-ignore on pull_request. The required check must report on every PR.
  # The changes job skips the compile job when a PR only touches docs.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  merge_group:
    branches:
      - main
  workflow_call: # Allow to be called from the release workflow

permissions:
  security-events: write  # required for CodeQL
  packages: read
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
    - name: Detect non-doc changes
      id: filter
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        if [ "$EVENT_NAME" != "pull_request" ]; then
          echo "code=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
        echo "Changed files:"
        echo "$files"
        # Same patterns as the push paths-ignore: docs/** and **.md.
        if echo "$files" | grep -qvE '^docs/|\.md$'; then
          echo "code=true" >> "$GITHUB_OUTPUT"
        else
          echo "code=false" >> "$GITHUB_OUTPUT"
        fi

  compile:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    env:
      IS_CODACY_COVERAGE_ALLOWED: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
      IS_QLTY_COVERAGE_ALLOWED: ${{ secrets.QLTY_COVERAGE_TOKEN != '' }}
      IS_TARGET_MAIN: ${{ github.ref == 'refs/heads/main' }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: ./global.json
  
    - name: NuGet Restore
      shell: pwsh
      run: dotnet restore
  
    - name: Build
      shell: pwsh
      run: dotnet build --no-restore --configuration Release /p:Deterministic=true /p:UseSharedCompilation=false /p:BuildInParallel=false /nodeReuse:false /bl:./artifacts/logs/release/build.release.binlog

    - name: Restore Code Coverage history
      uses: actions/download-artifact@v8
      with:
        name: CoverageHistory-${{ matrix.os }}
        path: ./artifacts/TestResults/coveragehistory
      continue-on-error: true

    - name: Test
      id: test-step
      run: dotnet test --no-build --configuration Release --settings ./build/targets/tests/test.runsettings
      continue-on-error: true
      env:
        REPORTGENERATOR_LICENSE: ${{ secrets.REPORTGENERATOR_LICENSE }}

    - name: Upload coverage history
      uses: actions/upload-artifact@v7
      if: success() && env.IS_TARGET_MAIN == 'true'
      with:
        name: CoverageHistory-${{ matrix.os }}
        path: ./artifacts/TestResults/coveragehistory
        retention-days: 7

    - name: Upload binlogs
      uses: actions/upload-artifact@v7
      if: success() || failure()
      with:
        name: binlogs-${{ matrix.os }}
        path: ./artifacts/logs
        retention-days: 7
        if-no-files-found: error

    - name: Upload SARIF files
      uses: actions/upload-artifact@v7
      if: success() || failure()
      with:
        name: SARIF files (${{ matrix.os }})
        path: ./artifacts/obj/**/*.sarif
        retention-days: 7

    - name: Upload Test Report
      uses: actions/upload-artifact@v7
      if: success() || failure()
      with:
        name: .NET Test Reports (${{ matrix.os }})
        path: ./artifacts/TestResults/**/*.trx
        retention-days: 7

    - name: Upload Code Coverage Report
      uses: actions/upload-artifact@v7
      if: success() || failure()
      with:
        name: .NET Code Coverage Reports (${{ matrix.os }})
        path: ./artifacts/TestResults/coverage/**
        retention-days: 7

    - name: Publish coverage summary to GitHub
      if: success() && steps.test-step.outcome == 'success'
      run: cat artifacts/TestResults/coverage/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
      shell: bash

    - name: Upload coverage data to Codacy
      if: ${{ runner.os == 'Linux' && env.IS_CODACY_COVERAGE_ALLOWED == 'true' }}
      uses: codacy/codacy-coverage-reporter-action@v1.3.0
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        coverage-reports: ${{ github.workspace }}/artifacts/TestResults/coverage/Cobertura.xml

    - name: Upload coverage data to Qlty
      if: ${{ runner.os == 'Linux' && env.IS_QLTY_COVERAGE_ALLOWED == 'true' }}
      uses: qltysh/qlty-action/coverage@v2
      with:
        token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
        files: ${{ github.workspace }}/artifacts/TestResults/coverage/Cobertura.xml

  # Gate for the required status check. The single matrix entry keeps the job
  # name `build (ubuntu-latest)`, which the main branch ruleset requires.
  # It passes when compile passed, or when compile was skipped for a docs-only PR.
  build:
    needs: [changes, compile]
    if: always()
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Check compile result
      env:
        CHANGES_RESULT: ${{ needs.changes.result }}
        CODE_CHANGED: ${{ needs.changes.outputs.code }}
        COMPILE_RESULT: ${{ needs.compile.result }}
      run: |
        echo "changes=$CHANGES_RESULT code=$CODE_CHANGED compile=$COMPILE_RESULT"
        if [ "$CHANGES_RESULT" != "success" ]; then
          exit 1
        fi
        if [ "$CODE_CHANGED" = "false" ] && [ "$COMPILE_RESULT" = "skipped" ]; then
          exit 0
        fi
        [ "$COMPILE_RESULT" = "success" ]
